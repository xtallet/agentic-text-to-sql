[project]
name = "agentic-text-to-sql"
version = "0.1.0"
description = "LangGraph agent that answers natural language questions over the Chinook database"
authors = [{name = "Xavi Tallet"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain==1.1.0",
    "langchain-openai>=1.1.0",
    "langgraph==1.0.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
]
